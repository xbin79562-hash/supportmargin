name: Pricing Drift Watch

on:
  # UTC 02:00 every Monday == 10:00 Monday (Asia/Shanghai, UTC+8).
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: validate locally without live vendor requests (never creates an issue)"
        type: boolean
        required: false
        default: false
      create_issue_on_failure:
        description: "Also alert when vendor pages could not be fetched (failed checks)"
        type: boolean
        required: false
        default: true
      update_baseline:
        description: "Run --update-baseline on GitHub runner and open a PR updating scripts/pricing-drift-baseline.json"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write is required only to push the baseline branch; cron and regular
# dispatch runs never reach that step, but permissions are workflow-wide.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  drift-check:
    name: Weekly vendor pricing drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------------
      # Regular path: weekly cron + normal workflow_dispatch (read-only).
      # It is mutually exclusive with the manual baseline-update mode, so a
      # scheduled run can never write scripts/pricing-drift-baseline.json.
      # ------------------------------------------------------------------
      - name: Run pricing drift check
        id: drift
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_baseline != true }}
        shell: bash
        run: |
          mkdir -p tmp
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN requested: skipping live vendor requests."
            node scripts/check-pricing-drift.mjs --dry-run \
              --report-json tmp/pricing-drift-report.json \
              --report-md tmp/pricing-drift-report.md
          else
            echo "Live vendor pricing check."
            node scripts/check-pricing-drift.mjs \
              --report-json tmp/pricing-drift-report.json \
              --report-md tmp/pricing-drift-report.md
          fi

      - name: Append Markdown report to job summary
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.update_baseline != true) }}
        shell: bash
        run: |
          if [ -f tmp/pricing-drift-report.md ]; then
            cat tmp/pricing-drift-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pricing drift report was generated in this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.update_baseline != true) }}
        uses: actions/upload-artifact@v4
        with:
          name: pricing-drift-report
          path: tmp/pricing-drift-report.*
          retention-days: 14
          if-no-files-found: warn

      - name: Create or update pricing drift issue
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.update_baseline != true) }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const jsonPath = 'tmp/pricing-drift-report.json';
            const mdPath = 'tmp/pricing-drift-report.md';

            if (!fs.existsSync(jsonPath)) {
              core.warning('No JSON report found; skipping issue sync.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            const markdown = fs.existsSync(mdPath)
              ? fs.readFileSync(mdPath, 'utf8')
              : '(Markdown report unavailable for this run.)';

            const rawDry = context.payload.inputs?.dry_run;
            const dryRun =
              report.mode === 'dry-run' || rawDry === true || rawDry === 'true';
            const rawCreate = context.payload.inputs?.create_issue_on_failure;
            const createIssueOnFailure =
              rawCreate === undefined || rawCreate === ''
                ? true
                : rawCreate === true || rawCreate === 'true';

            const drifted = Array.isArray(report.drifted) ? report.drifted : [];
            const failed = Array.isArray(report.failed) ? report.failed : [];
            const needsIssue =
              drifted.length > 0 || (createIssueOnFailure && failed.length > 0);

            // Dry runs and clean runs never open or touch an issue.
            if (dryRun) {
              core.info('Dry run: issue creation/comment is disabled.');
              return;
            }
            if (!needsIssue) {
              core.info(
                `No issue needed: drifted=${drifted.length}, failed=${failed.length}, ` +
                `unchanged=${report.counts?.unchanged ?? 0}.`
              );
              return;
            }

            const { owner, repo } = context.repo;
            const label = 'pricing-drift';

            // Ensure the label exists before searching/creating issues.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: 'B60205',
                  description: 'Automated vendor pricing drift alert',
                });
                core.info(`Created missing label ${label}.`);
              } else {
                throw error;
              }
            }

            // De-duplication: reuse the first open issue carrying the label.
            const candidates = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const openIssues = candidates.filter((issue) => !issue.pull_request);

            const utcDate = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const onlyFailures = drifted.length === 0 && failed.length > 0;
            const title = onlyFailures
              ? `[Pricing Check Warning] Vendor pages could not be verified (${utcDate})`
              : `[Pricing Drift] Detected vendor pricing changes (${utcDate})`;

            if (openIssues.length > 0) {
              const issue = openIssues[0];
              const body = [
                `### Pricing drift re-check — ${utcDate} (UTC)`,
                '',
                `Workflow run: ${runUrl}`,
                `drifted=${drifted.length}, failed=${failed.length}, ` +
                  `unchanged=${report.counts?.unchanged ?? 0}`,
                '',
                '<details><summary>Full report</summary>',
                '',
                markdown,
                '',
                '</details>',
              ].join('\n');
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body,
              });
              core.info(`Appended a comment to existing issue #${issue.number}.`);
            } else {
              const body = [
                `Automated vendor pricing check detected **${drifted.length} drifted** ` +
                  `and **${failed.length} failed** vendor page(s).`,
                '',
                `Workflow run: ${runUrl}`,
                `Catalog verifiedAt: ${report.catalogVerifiedAt ?? 'unknown'}`,
                '',
                markdown,
              ].join('\n');
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Created issue #${created.data.number}: ${title}`);
            }

      # ------------------------------------------------------------------
      # Manual cloud-only path: refresh the baseline on a GitHub-hosted runner
      # (no local proxy), force-push a fixed branch, open/reuse a PR to main.
      # ONLY reachable via workflow_dispatch with update_baseline=true.
      # ------------------------------------------------------------------
      - name: Update pricing drift baseline on GitHub runner
        id: baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline == true }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp
          echo "Mode: manual baseline update on a GitHub-hosted runner (no local proxy)."
          node scripts/check-pricing-drift.mjs --update-baseline 2>&1 | tee tmp/baseline-run.log
          drift_exit="${PIPESTATUS[0]}"
          echo "drift_exit=${drift_exit}" >> "$GITHUB_OUTPUT"
          echo "::notice::check-pricing-drift.mjs exited ${drift_exit}; a non-zero code usually means some vendor pages were unreachable, but every successfully captured snapshot is still written."

          if git diff --quiet scripts/pricing-drift-baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Baseline update"
              echo ""
              echo "No changes in \`scripts/pricing-drift-baseline.json\` — skipping branch push and PR creation."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Baseline unchanged; nothing to commit."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### Vendor pricing baseline change summary"
            echo ""
            echo "- Workflow run: ${run_url}"
            echo "- Trigger: workflow_dispatch with \`update_baseline=true\` (GitHub-hosted runner, no local proxy)"
            echo "- check-pricing-drift.mjs exit code: \`${drift_exit}\`"
            echo ""
            echo '```diff'
            git diff -- scripts/pricing-drift-baseline.json
            echo '```'
            echo ""
            echo "### Check log"
            echo ""
            echo '```text'
            grep -E '^(\[STABLE\]|\[CHANGED\]|\[FETCH_FAILED\]|\[BASELINE_UNSET\]|SUMMARY:|Baseline updated:)' tmp/baseline-run.log || true
            echo '```'
          } > tmp/baseline-change-summary.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/update-pricing-baseline
          git add scripts/pricing-drift-baseline.json
          git commit -m "chore: update vendor pricing drift baseline"
          git push --force origin chore/update-pricing-baseline
          echo "Force-pushed updated baseline to chore/update-pricing-baseline."

      - name: Create or reuse baseline update PR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline == true && steps.baseline.outputs.changed == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const head = 'chore/update-pricing-baseline';
            const base = 'main';
            const title = 'chore: update vendor pricing drift baseline';
            const summaryPath = 'tmp/baseline-change-summary.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '_(change summary unavailable for this run)_';
            const compareUrl = `${context.serverUrl}/${owner}/${repo}/compare/${base}...${head}?expand=1`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            function appendSummary(text) {
              const target = process.env.GITHUB_STEP_SUMMARY;
              if (target) fs.appendFileSync(target, `\n${text}\n`);
            }

            // Reuse an existing open PR targeting main from the fixed branch.
            const existing = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 100,
            });

            if (existing.length > 0) {
              const pr = existing[0];
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: [
                  `### Baseline refreshed — ${new Date().toISOString().slice(0, 10)} (UTC)`,
                  '',
                  `Workflow run: ${runUrl}`,
                  '',
                  summary,
                ].join('\n'),
              });
              core.info(`Reused existing PR #${pr.number}: ${pr.html_url}`);
              appendSummary(`## Baseline PR reused\n\nExisting PR #${pr.number}: ${pr.html_url}`);
              return;
            }

            const body = [
              'Automated vendor pricing baseline refresh, produced on a GitHub-hosted runner (no local proxy).',
              '',
              `Workflow run: ${runUrl}`,
              '',
              summary,
              '',
              '> Verify each vendor pricing page before merging. This PR only updates `scripts/pricing-drift-baseline.json`.',
            ].join('\n');

            try {
              const created = await github.rest.pulls.create({
                ...context.repo,
                head,
                base,
                title,
                body,
              });
              core.info(`Created PR #${created.data.number}: ${created.data.html_url}`);
              appendSummary(`## Baseline PR created\n\nPR #${created.data.number}: ${created.data.html_url}`);
            } catch (error) {
              // 403 == repo setting "Allow GitHub Actions to create and approve
              // pull requests" is disabled. Never fail the whole job: the branch
              // was already pushed, so give a one-click manual compare link.
              if (error.status !== 403) throw error;
              core.warning('pulls.create returned 403 — GitHub Actions PR creation is disabled for this repository.');
              appendSummary([
                '## Action required: create the baseline PR manually',
                '',
                'PR creation returned **403**: this repository has *"Allow GitHub Actions to create and approve pull requests"* disabled.',
                '',
                `The updated baseline was still force-pushed to \`${head}\`.`,
                '',
                'Enable the setting under **Settings → Actions → General → Workflow permissions** and re-run this workflow, or open the PR manually:',
                '',
                `[Open compare / create PR manually](${compareUrl})`,
                '',
                `Compare URL: ${compareUrl}`,
              ].join('\n'));
              core.info(`Manual PR compare link: ${compareUrl}`);
            }
